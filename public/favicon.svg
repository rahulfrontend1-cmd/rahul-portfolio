<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#1a2235"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2c97e"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Gold border accent -->
  <rect width="32" height="32" rx="6" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Top-left corner accent -->
  <path d="M4 4 L4 8 M4 4 L8 4" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Bottom-right corner accent -->
  <path d="M28 28 L28 24 M28 28 L24 28" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- R letter -->
  <g fill="url(#gold)">
    <!-- R vertical stem -->
    <rect x="7" y="9" width="2.2" height="14"/>
    <!-- R top bowl -->
    <path d="M9.2 9 Q15.5 9 15.5 13 Q15.5 17 9.2 17 L9.2 15 Q13.2 15 13.2 13 Q13.2 11 9.2 11 Z"/>
    <!-- R leg -->
    <path d="M11 17 L15.8 23 L13.2 23 L8.8 17.5 Z"/>
  </g>

  <!-- K letter -->
  <g fill="url(#gold)">
    <!-- K vertical stem -->
    <rect x="17.5" y="9" width="2.2" height="14"/>
    <!-- K upper arm -->
    <path d="M19.7 15.5 L25 9 L22.5 9 L17.5 14.8 L17.5 16.2 L19.7 16.2 Z"/>
    <!-- K lower arm -->
    <path d="M19.7 16.5 L25 23 L22.5 23 L17.5 17.2 L17.5 15.8 Z"/>
  </g>
</svg>
